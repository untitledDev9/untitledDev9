<svg width="900" height="12" viewBox="0 0 900 12" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6f3f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#56d364"/>
      <stop offset="100%" stop-color="#1f6f3f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aff5b4"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="5" width="900" height="2" fill="url(#dl)"/>
  <circle cy="6" r="6" fill="url(#dot)">
    <animate attributeName="cx" values="60;840;60" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cy="6" r="2.5" fill="#eafff0">
    <animate attributeName="cx" values="60;840;60" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
</svg>
