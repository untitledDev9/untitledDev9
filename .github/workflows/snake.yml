name: Generate Snake

# Builds the contribution-snake SVGs used in README.md and pushes them
# to the `output` branch. Runs every 12h, on push to main, and on demand.
on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # No `palette=` keyword -> TRANSPARENT background (avoids the all-black box).
          # color_dots goes empty -> bright; color_snake is the moving snake.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=2ea043&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=7ee787&color_dots=0d2417,1f6f3f,2ea043,3fb950,aff5b4

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
