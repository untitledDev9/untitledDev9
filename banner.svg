<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#04120c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes typing { from { width:0 } to { width:100% } }
    </style>
  </defs>

  <rect width="900" height="240" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="none" stroke="#1f6f3f" stroke-opacity="0.5"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="900" height="40" rx="14" fill="#0c1b13"/>
  <rect x="0" y="26" width="900" height="14" fill="#0c1b13"/>
  <circle cx="26" cy="20" r="6" fill="#2ea043"/>
  <circle cx="48" cy="20" r="6" fill="#3fb950" fill-opacity="0.6"/>
  <circle cx="70" cy="20" r="6" fill="#56d364" fill-opacity="0.4"/>
  <text x="450" y="25" text-anchor="middle" fill="#5c8a6e" font-size="13">ahmed@dev — zsh</text>

  <!-- terminal body -->
  <text x="36" y="86" font-size="16" fill="#3fb950">$ <tspan fill="#7ee787">whoami</tspan></text>
  <text x="36" y="118" font-size="30" font-weight="700" fill="url(#green)">Ahmed Suleiman</text>
  <text x="36" y="150" font-size="15" fill="#8fbf9f">Full-Stack Developer · Founder of GadgetVault · Product Builder</text>

  <text x="36" y="190" font-size="16" fill="#3fb950">$ <tspan fill="#7ee787">cat focus.txt</tspan></text>
  <text x="36" y="218" font-size="14" fill="#6fae84">Scalable mobile &amp; web products · clean architecture · real-world impact</text>

  <rect class="cursor" x="566" y="206" width="9" height="16" fill="#56d364"/>
</svg>
